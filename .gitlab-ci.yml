# CI Automation: the ci-automation-mr and ci-automation-changelog jobs come
# from the components included at the top of this file. The blocks below only
# adapt them to this repo (background in decisions.md, ci-automation-component).
#
# Both need the cache override: they run in the ci-automation image (no
# pnpm/node), so the repo-global default cache would fail. No before_script
# override: since components 0.0.3 the component jobs carry their own
# before_script (the Vault token fetch), which already replaces the global
# default.before_script — clearing it here would silently disable the fetch.
ci-automation-mr:
  cache: []

# git-cliff is a dependency of the `site` uv project (there is no root uv
# project) and the changelog lives under site/, so both differ from the
# component defaults (project dir ".", CHANGELOG.md) and must be set here.
ci-automation-changelog:
  interruptible: false
  cache: []
  variables:
    CI_AUTOMATION_CHANGELOG_PATH: "site/docs/development/changelog.md"
    CI_AUTOMATION_CHANGELOG_CLIFF_PROJECT_DIR: "site"
