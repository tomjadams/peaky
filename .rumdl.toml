# rumdl configuration — markdown linting for site/docs/
# See: https://github.com/rvben/rumdl

# Auto-generated files and OpenSpec deltas with intentional H2-first grammar.
exclude = [
  "site/docs/development/changelog.md",
  "openspec/changes/**/specs/**/spec.md",
]

# OpenSpec artifact templates intentionally begin with H2 sections because they are
# fragments rendered into generated artifacts rather than standalone documents.
[per-file-ignores]
"openspec/schemas/**/templates/*.md" = ["MD041"]
"openspec/changes/**/*.md" = ["MD041"]

[MD013]
# Line length — disabled; docs have tables, long URLs, and mermaid diagrams
enabled = false

[MD009]
# Trailing spaces — allow 2 spaces for <br> line breaks (common in markdown)
br_spaces = 2

[MD046]
# Code block style — disabled; docs mix fenced and indented blocks
enabled = false

[MD036]
# Emphasis used as heading — too many false positives on bold text
enabled = false

[MD033]
# Inline HTML — needed for docs with custom elements, admonitions, etc.
enabled = false

[MD004]
# Unordered list style — allow any consistent style
style = "consistent"
