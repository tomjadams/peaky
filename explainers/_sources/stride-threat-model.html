function renderChecklist(sel, items) {
  var host = kitMount(sel);
  host.classList.add('chk-wrap');
  items.forEach(function (it, i) {
    var row = kitEl('div', 'chk-row');
    row.dataset.id = 'c' + (i + 1);
    row.tabIndex = 0; row.setAttribute('role', 'checkbox'); row.setAttribute('aria-checked', 'false');
    row.innerHTML = '<span class="chk-box">\u2713</span><span class="chk-label">' + it.label + '</span>' + kitFlag({kind: it.kind, label: it.tag});
    function toggle() {
      row.classList.toggle('checked');
      row.setAttribute('aria-checked', row.classList.contains('checked') ? 'true' : 'false');
      try { localStorage.setItem('stride-check-' + row.dataset.id, row.classList.contains('checked') ? '1' : '0'); } catch (e) {}
      updateChecklistProgress();
    }
    row.addEventListener('click', toggle);
    row.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    host.appendChild(row);
  });
}
function updateChecklistProgress() {
  var total = document.querySelectorAll('.chk-row').length;

}

});
