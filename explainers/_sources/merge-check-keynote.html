/* Drift beats — the problem, animated */
function driftBeat(i){
  var fill=document.getElementById('driftFill'),badge=document.getElementById('driftBadge'),

  fill.classList.remove('blocked','fixed');review.classList.remove('behind','caught');

    cap.innerHTML='<b>Pre-merge check.</b> The CI gate compares the reviewed commit against the one at HEAD.';
  }else if(i===3){
