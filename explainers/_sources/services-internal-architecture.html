  var html = escHtml(text);
  var tokens = [];
  var tok = function(cls, m){ var i = tokens.length; tokens.push('<span class="'+cls+'">'+m+'</span>'); return '\x00'+i+'\x00'; };
  html = html.replace(/(\/\/[^\n]*)/g, function(m){ return tok('y-com', m); });

  var kws = ['package','import','func','type','struct','interface','map','return','if','else','for','range','switch','case','default','var','const'];
  html = html.replace(new RegExp('\\b('+kws.join('|')+')\\b','g'), '<span class="y-key">$1</span>');
  html = html.replace(/(?<!\x00)\b(\d+)\b(?!\x00)/g, '<span class="y-num">$1</span>');
  return html.replace(/\x00(\d+)\x00/g, function(_, i){ return tokens[+i]; });
}

    label: 'Imports',
    title: 'package main imports what it needs',
    body: 'Go compiles only what <code>main</code> imports \u2014 the import list of a binary <em>is</em> its contents. <code>peaky-sse</code> imports <code>sse</code>, <code>authz</code>, and <code>middleware</code>, nothing else, so catalog, events, and sync code never enter it.',
    code: { filename: 'cmd/peaky-sse/main.go', html: highlightGo(

	".../internal/sse"          // the one feature it serves

	".../internal/middleware"
	// no catalog, events, or syncengine \u2014 so none of it is in this binary
)`) }

  {
    label: 'Wire',
    title: 'main wires the dependencies',
    body: 'Each <code>main.go</code> is the one place dependencies are assembled: open the DB, load the actor registry, construct the handlers. Swap the registry for Cedar, or Postgres for a fake, and only <code>main</code> changes.',

    code: { filename: 'cmd/peaky-api/main.go \u2014 each feature registers itself', html: highlightGo(

attachment.RegisterRoutes(s, attachmentHandlers)`) }
  }
