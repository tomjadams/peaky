    <h1 class="display">Governance<br><em>as events.</em></h1>
    <p class="lede">Features subscribe to GitLab events via <code>RUNS_ON</code> and return the writes they want. The framework reads, runs them in parallel, and applies every action in one auditable write seam. Adopt it as a CI job today; grow into a hosted webhook server later by swapping one adapter — the core never changes.</p>

        <p><em>Event-driven plugins.</em> Each feature subscribes via <code>RUNS_ON</code>. Adding one is a config model + <code>RUNS_ON</code> + a pure <code>run()</code> — nothing else to wire.</p>
        <p><em>Pure features return actions.</em> They read state and return <code>AddLabel(…)</code> / <code>SetTitle(…)</code>; the framework applies them in one serial write seam after the pool joins. Purity is what makes parallel safe.</p>
        <p><em>Grows without a rewrite.</em> The typed <button class="term" data-term="event">Event</button> is GitLab-faithful. Env today, webhook later is an adapter swap — Event, Feature, <code>RUNS_ON</code>, actions, and client are unchanged.</p>

    <h2 class="sec-title">The visibility problem</h2>
    <p class="sec-sub">GitLab CI gives you a job, not a step. When governance checks live inside one job, the pipeline can't tell you which one broke — and running them as separate jobs pays a cold-start tax for &lt;1s of work each.</p>

  <div class="reveal" id="archHead">
    <span class="eyebrow">02 · The architecture</span>
    <h2 class="sec-title">One entry point, pure features, <em>one write seam</em></h2>
    <p class="sec-sub">A single entry point builds a typed <button class="term" data-term="event">Event</button>, discovers every feature, and runs the ones that subscribe to it through a <button class="term" data-term="threadpool">ThreadPoolExecutor</button>. Each feature gets a <button class="term" data-term="featurecontext">FeatureContext</button> and stays pure — it reads state and returns <button class="term" data-term="actions">actions</button>; the framework applies every one of them in a single serial phase after the pool joins.</p>
  </div>

  <p class="muted-note reveal reveal-delay-1">Concurrency is in service of the model, not the headline — it's safe only because a feature never mutates mid-run, so two running at once can't race on MR state.</p>

function hlEsc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hlWrap(html, toks){ return html.replace(/\x00(\d+)\x00/g, function(_, i){ return toks[+i]; }); }
function hlPy(code){
  var html = hlEsc(code), toks = [];
  function T(cls, m){ toks.push('<span class="' + cls + '">' + m + '</span>'); return '\x00' + (toks.length - 1) + '\x00'; }
  html = html.replace(/(#[^\n]*)/g, function(m){ return T('y-com', m); });
  html = html.replace(/("(?:[^"\\]|\\.)*")/g, function(m){ return T('y-str', m); });
  var kws = ['def','class','return','if','else','not','in','import','from'];
  html = html.replace(new RegExp('\\b(' + kws.join('|') + ')\\b', 'g'), '<span class="y-key">$1</span>');
  html = html.replace(/\b(\d+)\b/g, '<span class="y-num">$1</span>');
  return hlWrap(html, toks);
}
function hlYaml(code){
  var html = hlEsc(code), toks = [];
  function T(cls, m){ toks.push('<span class="' + cls + '">' + m + '</span>'); return '\x00' + (toks.length - 1) + '\x00'; }
  html = html.replace(/^(\s*)([\w-]+)(:)/gm, function(m, p1, p2, p3){ return p1 + T('y-key', p2) + p3; });
  html = html.replace(/\b(true|false)\b/g, '<span class="y-bool">$1</span>');
  return hlWrap(html, toks);
}

    {aspect:'ThreadPoolExecutor in one job', before:'Separate CI jobs per check', after:'Concurrency serves purity, not the reverse — one job, threads for I/O-bound calls, avoiding 10\u201330s of cold start per job for &lt;1s of work.'},
