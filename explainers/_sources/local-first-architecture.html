        <p>Conflicts resolve per field with a Hybrid Logical Clock. Server-sent events wake connected peers instantly — no polling, no domain data on the wire.</p>

<!-- ── 01 · THE PROBLEM ── -->
<section id="oldworld">
  <div class="reveal" id="oldworldHead">
    <span class="eyebrow">01 · The problem</span>
    <h2 class="sec-title">Every save waits on the network</h2>
    <p class="sec-sub">Client → server → Postgres → client. Simple to reason about. The wait becomes the whole experience once a team spans continents.</p>
  </div>
  <div class="prose reveal reveal-delay-1">
    <p>Most apps default to one model: click Save, wait for the server's response, then update the UI. In a single office the round trip is 2–5&nbsp;ms — no one notices.</p>
    <p>Across continents it is the dominant experience. Every save pays the network cost in full, twice over: once out, once back.</p>
  </div>
  <div class="artifact reveal reveal-delay-2" id="oldworldStat"></div>
</section>

<!-- ── 02 · THE FIXES THAT FAIL ── -->
<section id="fixesfail">
  <div class="reveal" id="fixesfailHead">
    <span class="eyebrow">02 · The fixes that fail</span>
    <h2 class="sec-title">Replication and pub-sub trade one problem for another</h2>
    <p class="sec-sub">Neither approach changes where a write lands first. The server stays in the critical path, and each new layer adds its own failure mode.</p>
  </div>
  <div class="artifact reveal reveal-delay-1" id="fixesfailLedger"></div>
  <p class="muted-note reveal reveal-delay-2">Neither of these moves where writes land first. The server is still in the critical path — every new layer just adds its own failure mode.</p>
</section>

<!-- ── 03 · FLIP THE MODEL ── -->
<section id="concept">
  <div class="reveal" id="conceptHead">
    <span class="eyebrow">03 · Local-first: flip the model</span>
    <h2 class="sec-title">Write local. Sync in the background.</h2>
    <p class="sec-sub">Make the browser the immediate source of truth. Let the server be the background authority — additive to the interaction loop, not foundational to it.</p>
  </div>
  <div class="prose reveal reveal-delay-1">
    <p>Instead of: click → wait for the server → update the UI. Local-first: click → write to local SQLite (≈1&nbsp;ms) → update the UI → sync to the server in the background. If the network is slow or fully down, the change queues in an outbox and flushes when connectivity returns.</p>
  </div>
  <div class="artifact reveal reveal-delay-2" id="conceptComparison"></div>
</section>

<!-- ── 04 · THE SHAPE ── -->
<section id="shape">
  <div class="reveal" id="shapeHead">
    <span class="eyebrow">04 · The shape</span>
    <h2 class="sec-title">Two processes, one shared schema</h2>
    <p class="sec-sub">The browser owns the write path. The server owns durability and fan-out. <code>shared/db/schema/*</code> is the one authority both read from.</p>
  </div>
  <div class="artifact reveal reveal-delay-1" id="shapeTree"></div>
</section>

<!-- ── 05 · GLOBAL SYNC ── -->
<section id="global">
  <div class="reveal" id="globalHead">
    <span class="eyebrow">05 · One instant experience, three continents</span>
    <h2 class="sec-title">The write is local. The sync is a pipeline.</h2>
    <p class="sec-sub">Amsterdam at 9&nbsp;AM, Singapore at 11&nbsp;PM — write latency is the same everywhere, because the network is never in the path of the write itself.</p>
  </div>
  <figure class="reveal reveal-delay-1" id="globalFlow" aria-label="the local-first sync pipeline"></figure>
  <p class="muted-note reveal reveal-delay-2">Every Peaky user writes against a local SQLite database that lives in <button class="term" data-term="opfs">OPFS</button> and persists across page loads. When two people edit the same field at once, both changes reach the server; the loser is never silently dropped — it loses one field's conflict, not the whole write.</p>
</section>

<!-- ── 06 · RESILIENCE ── -->
<section id="resilience">
  <div class="reveal" id="resilienceHead">
    <span class="eyebrow">06 · Resilience</span>
    <h2 class="sec-title">The client doesn't depend on the server being up</h2>
    <p class="sec-sub">Traditional apps fail two ways when the network degrades: a spinner until it returns, or a silently dropped write. Local-first avoids both — the <button class="term" data-term="outbox">outbox</button> queues and flushes whenever connectivity allows, even hours later.</p>
  </div>
  <div class="artifact reveal reveal-delay-1" id="resilienceBA"></div>
</section>

<!-- ── 07 · CONFLICTS & HLC ── -->
<section id="conflicts">
  <div class="reveal" id="conflictsHead">
    <span class="eyebrow">07 · Conflicts &amp; HLC</span>
    <h2 class="sec-title">Two people, one field, at the same time</h2>
    <p class="sec-sub">Local-first removes the server from the write path — so two people can edit the same field while offline or on high latency. Something has to decide, deterministically, which write wins.</p>
  </div>
  <div class="prose reveal reveal-delay-1">
    <p>A traditional server serializes every write; the second one silently overwrites the first, and the user never finds out. Local-first can't rely on that — writes arrive out of order, sometimes hours apart.</p>
    <p>Wall-clock "last write wins" fails too: client clocks drift. A laptop resuming from sleep can read 90 seconds behind — every write from it would lose, always.</p>
    <p>A <button class="term" data-term="hlc">Hybrid Logical Clock</button> combines the wall clock, a logical counter, and the actor's id into one string. Comparing two HLCs lexicographically gives a total order that survives clock drift and stays correct even within the same millisecond.</p>
  </div>
  <div class="artifact reveal reveal-delay-2" id="conflictsCode">
    <p class="eyebrow" style="margin-bottom:16px">HLC wire format</p>
    <div class="code-block">
      <div class="code-head"><i></i>conflict.go</div>
<pre><span class="y-str">"1716220800000</span><span class="y-com">:</span><span class="y-num">0001</span><span class="y-com">:</span><span class="y-key">actor_alice"</span>
<span class="y-com">// wallclock (unix ms) : counter (zero-padded, 4 digits) : actorId (deterministic tiebreak)</span></pre>
    </div>
  </div>
  <div class="artifact reveal reveal-delay-3" id="conflictsStepper"></div>
  <div class="artifact reveal reveal-delay-4" id="conflictsLedger"></div>
</section>

<!-- ── 08 · SSE ── -->
<section id="sse">
  <div class="reveal" id="sseHead">
    <span class="eyebrow">08 · Real-time updates</span>
    <h2 class="sec-title">Real-time, without domain data on the wire</h2>
    <p class="sec-sub">Without <button class="term" data-term="sse">SSE</button>, a browser polls every 30 seconds. With it, PostgreSQL's own notify wakes every entitled peer the moment a push lands.</p>
  </div>
  <div class="artifact reveal reveal-delay-1" id="sseContrast"></div>
  <div class="artifact reveal reveal-delay-2" id="ssePayload">
    <p class="eyebrow" style="margin-bottom:16px">SSE payload — cursor pointer only</p>
    <div class="code-block">
      <div class="code-head"><i></i>data: (peaky-sse frame)</div>
<pre>{
  <span class="y-key">"cursor"</span>: <span class="y-str">"2026-06-10T09:00:00.000000000Z"</span>,
  <span class="y-key">"subjectType"</span>: <span class="y-str">"team"</span>,
  <span class="y-key">"subjectId"</span>: <span class="y-str">"payments-scalability"</span>
}</pre>
    </div>
    <p class="muted-note">No field values. No user data. No secrets. <code>peaky-sse</code> never holds domain data — it cannot leak what it does not have.</p>
  </div>
</section>

<!-- ── 09 · PEAKY END TO END ── -->
<section id="walkthrough">

    <p class="sec-sub">Alice clicks Save in Amsterdam. Bob's screen updates in Singapore. Only two of the nine steps touch the network, and neither is on Alice's critical path.</p>
  </div>

</section>

  {label:'Step 1', title:'User action in the browser', body:'Alice (Amsterdam) types an answer and clicks Save. A Vue composable delegates to a domain service. No spinner appears \u2014 the network is not consulted.'},
  {label:'Step 2', title:'LocalMutation.commit()', body:'One SQLite transaction: the answer row is written, a domain event is inserted into <code>events</code>, and an entry is queued in <code>local_outbox</code>. All three succeed, or none do.'},
  {label:'Step 3', title:'Reactive update', body:'SQLite commits in ~1 ms. Drizzle\u2019s reactive queries observe the new row \u2014 the UI shows "Saved" before any network packet has left Alice\u2019s browser.'},
  {label:'Step 4', title:'SyncEngine drains the outbox', body:'The background <code>SyncEngine</code> batches pending entries and calls <code>POST /sync/push</code> on <code>peaky-api</code>. If the network is down, exponential backoff waits \u2014 Alice is unaffected either way.'},
  {label:'Step 5', title:'peaky-api: per-field HLC resolution', body:'For each field, <code>peaky-api</code> compares the incoming HLC against the stored version. Newer HLCs are accepted; older ones are rejected \u2014 independently, per field.'},
  {label:'Step 6', title:'pg_notify fires', body:'After accepting the push, <code>peaky-api</code> calls <code>pg_notify(\'sync:{subjectType}:{subjectId}\', \'{"cursor":"\u2026"}\')</code>. PostgreSQL delivers it to every listening connection in the cluster \u2014 no external message bus.'},
  {label:'Step 7', title:'peaky-sse fans out', body:'<code>peaky-sse</code> holds a dedicated PG LISTEN connection. On notification, it sends a cursor-pointer frame to every entitled browser \u2014 no domain data crosses the wire.'},
  {label:'Step 8', title:'Bob (Singapore) pulls', body:'Bob\u2019s browser receives the frame and calls <code>pullChanges()</code>. The pull is incremental and entitlement-gated on <code>peaky-api</code>; Bob\u2019s local SQLite updates and his UI reflects Alice\u2019s answer.'},
  {label:'End state', title:'Converged', body:'Both browsers hold the same answer locally. PostgreSQL is still the durable authority. If either browser goes offline now, it already has the latest state \u2014 there is nothing left to push.'}
]});

    {title:'SSE is an optimization, not a dependency', sub:'a client without SSE still converges via 30s polling \u2014 losing it degrades experience, not correctness'}
  ]
}]});
