<section id="top" class="hero">
  <div class="reveal" id="heroIntro">
    <div class="hero-kicker">Peaky · Ways of Working</div>
    <h1 class="display">Built once,<br><em>reuse anywhere.</em></h1>
    <p class="lede">How we plan, build, review, and learn on Peaky — and which parts of that workflow other RTF products can reuse as-is.</p>
    <p class="gloss-hint">New to the stack? <button class="term" data-term="gloss">Dotted terms</button> open a plain-English definition. Press <b>P</b> to present.</p>
  </div>
  <div class="reveal reveal-delay-1 aside-col" id="heroNote">
    <p>Built with intent, not under pressure: a <button class="term" data-term="openspec">change workflow</button>, <button class="term" data-term="droids">14 adversarial reviewers plus an rtf-outcome-verifier</button>, a governed CI pipeline, and an <button class="term" data-term="ia">information architecture</button> that serves humans and agents alike.</p>
    <p>Most of it is portable. The question this page answers: <em>what can your product reuse today?</em></p>
  </div>
</section>

<!-- ── 01 · PRODUCT & WAYS OF WORKING ── -->
<section id="product">
  <div class="reveal" id="productHead">
    <span class="eyebrow">01 · Product &amp; ways of working</span>
    <h2 class="sec-title">Product &amp; ways of working</h2>
    <p class="sec-sub">One source of truth for direction, a fixed shape for every issue, and labels that organize themselves by machine.</p>
  </div>

  <div class="reveal reveal-delay-1 artifact" id="productFlow">
    <div class="block-head"><span class="eyebrow">The product loop — customer calls to traceable backlog</span><span class="data-stamp">feeds the dev loop</span></div>
    <p class="sec-sub" style="margin-top:0">From customer calls to GitLab — three stages, with <code>/new-work</code> closing the loop so the roadmap stays honest.</p>
    <div id="productLoopLoop"></div>
    <p class="muted-note"><button class="term" data-term="discovery">/discovery</button> instills product thinking without drowning anyone in questions — and <button class="term" data-term="newwork">/new-work</button> takes the cost of changing our minds into account, so we can think sprint but change direction if we need to. Everything stays traceable.</p>
  </div>

  <div class="reveal reveal-delay-1 artifact" id="issueTemplates">
    <div id="issueTemplateTiles"></div>
  </div>

  <div class="reveal reveal-delay-1 artifact" id="labelTaxonomy">
    <div id="labelTags"></div>
    <p class="muted-note">Green axes work for any project. Cyan axes need a rename or adaptation. Red is Peaky-specific. Domain and size labels are auto-applied by path-glob rules in <code>ci-automation.yaml</code> — unmatched labels auto-remove, so the set never drifts. <a href="https://gitlab.is.adyen.com/containers/rtf/peaky/-/issues/42" target="_blank" style="color:var(--accent);text-decoration:none">Discussion #42 →</a></p>
  </div>
</section>

<!-- ── 02 · DEV WORKFLOW ── -->
<section id="dev">
  <div class="reveal" id="devHead">
    <span class="eyebrow">02 · Dev workflow</span>
    <h2 class="sec-title">Dev workflow</h2>
    <p class="sec-sub">One architecture for humans and agents, a loop from idea to retro, adversarial reviewers, and a deterministic floor that rises every cycle.</p>
  </div>

  <div class="reveal reveal-delay-1 artifact" id="iaTree1">
    <div class="block-head"><span class="eyebrow"><button class="term" data-term="ia">Information architecture</button></span><span class="data-stamp">AGENTS.md + .factory/</span></div>
    <div id="iaFiletree1"></div>
  </div>

  <div class="reveal reveal-delay-1 artifact" id="iaTree2">
    <div class="block-head"><span class="eyebrow">Information architecture — contracts &amp; docs</span><span class="data-stamp">openspec/ + site/docs/</span></div>
    <div id="iaFiletree2"></div>
    <p class="muted-note">Same source for both readers: a fresh droid session already knows the system, and so does a newcomer who asks it. <code>site/docs/development/decisions.md</code> is the cornerstone <button class="term" data-term="decisions">decision log</button>; it sits alongside <button class="term" data-term="designmd">DESIGN.md + visual-design.md</button> under <code>site/docs/</code>. Same folders, any project.</p>
  </div>

  <div class="reveal reveal-delay-1 artifact" id="devLoop">
    <div class="block-head"><span class="eyebrow">The dev loop — idea to shipped to learned-from</span><span class="data-stamp">the product loop above feeds this loop</span></div>
    <p class="sec-sub" style="margin-top:0">Fast and repeatable — an issue is picked up from the backlog and moves through seven stages. Each one runs an <button class="term" data-term="opsx">/opsx</button> command or a deterministic gate; step through it.</p>
    <div id="devLoopLoop"></div>
    <p class="muted-note"><button class="term" data-term="fizzbee">FizzBee</button> is deliberately not one stage — we're still codifying it as invariants injected at <code>/opsx:plan</code>. The loop closes at <button class="term" data-term="retro">/retro</button>: what it improves feeds back into stage 01, so the non-deterministic surface shrinks every cycle.</p>
  </div>

  <div class="reveal reveal-delay-1" id="droidIntro">
    <div id="droidDuo"></div>
  </div>

  <div class="reveal reveal-delay-1 artifact" id="droidWhat">
    <div class="block-head"><span class="eyebrow">What is a droid, actually?</span><span class="data-stamp">.factory/droids/*.md</span></div>
    <p class="sec-sub" style="margin-top:0">Four things to demystify before the roster: it's a markdown file, it's read-only, findings are graded, and it follows the same pattern as commands and skills.</p>
    <div id="droidStepper"></div>
  </div>

  <div class="reveal reveal-delay-1 artifact" id="droidRoster">
    <div class="block-head"><span class="eyebrow">Adversarial + outcome droid roster — 15 AI reviewers</span><span class="data-stamp">.factory/droids/ · 14 adversarial + 1 rtf-outcome-verifier</span></div>
    <div id="droidTiles"></div>
    <p class="muted-note">The name is the scope — each droid reviews one angle only. New domains just add a new droid. <code>rtf-outcome-verifier</code> sits adjacent to the adversarial roster — it runs by default against the change's acceptance criteria (auto-discovered from the branch issue or openspec change) and asks "did the diff actually deliver them?", which the 14 adversarial droids cannot. <button class="term" data-term="mergecheck">/merge-check</button> orchestrates the lot: path-routed by default, rtf-security-reviewer always, evidence-paired on every BLOCK/WARN finding, exit codes 0/1/2/3 — the loudest signal wins.</p>
  </div>

  <div class="reveal reveal-delay-1 artifact" id="droidContext">
    <div class="block-head"><span class="eyebrow">Enrich project specific patterns</span><span class="data-stamp">.factory/review-context/</span></div>
    <p class="sec-sub" style="margin-top:0">The seven pillars are the lens, but each droid loads project-specific context before reviewing. That's what makes a Go reviewer check HLC ordering, not just "concurrency."</p>
    <div id="droidContextStepper"></div>
  </div>

  <div class="reveal reveal-delay-2 artifact" id="droidPillars">
    <div class="block-head"><span class="eyebrow">What every reviewer looks for</span><span class="data-stamp">seven pillars, inspired by CodeRabbit</span></div>
    <div id="droidPillarLedger"></div>
    <p class="muted-note">Every adversarial droid applies the same lens to its own domain. A Go reviewer checks concurrency; a security reviewer checks trust boundaries \u2014 but both reason through the same pillars. The outcome droid adds the eighth question: did this change actually satisfy its acceptance criteria?</p>
  </div>

  <div class="reveal reveal-delay-2 artifact" id="ciGovern">
    <div class="block-head"><span class="eyebrow">Enforcing conventions, deterministically</span><span class="data-stamp">ci-automation.yaml · 5 checks</span></div>
    <div id="ciGovernReport"></div>
    <p class="muted-note">Reported to GitLab as <button class="term" data-term="junit">JUnit</button> test results plus one governance comment — never a wall of bot comments. <span class="flag next"><i></i>Next → shared <button class="term" data-term="gitlabcomponent">GitLab component</button> other RTF products include with one line</span></p>
  </div>

  <div class="reveal reveal-delay-2 artifact" id="detFloor">
    <div class="block-head" id="detFloorHead"><span class="eyebrow">The deterministic floor — local gates</span><span class="data-stamp">catch issues before they leave your machine</span></div>
    <div id="detFloorTiles"></div>
    <p class="muted-note" id="detFloorNote">Cheap, deterministic feedback first, locally. CI continues the suite — the point: agents only ever run on already-clean code.</p>
  </div>

  <div class="reveal reveal-delay-2 artifact" id="qualityFloor">
    <div class="block-head" id="qualityFloorHead"><span class="eyebrow">The quality floor — static analysis + tests</span><span class="data-stamp">linters prevent · tests prove</span></div>
    <div id="qualityLintTiles"></div>
    <div id="qualityPyramid"></div>
    <p class="muted-note" id="qualityFloorNote">Two systems, one floor: linters prevent whole classes of bugs statically — one per language, same concerns — while the pyramid proves behaviour. When a reviewer droid keeps catching something, it graduates into a linter rule and the droid shrinks.</p>
  </div>
</section>

function renderGovComment(i) {
  var s = ciGovernStates[i];
  var host = document.getElementById('ciGovernReport');
  var flagHTML = function(r) {
    return r.pass
      ? '<span class="flag done"><i></i>Pass</span>'
      : '<span class="flag gap"><i></i>Fail</span>';
  };
  var rows = s.rows.map(function(r) {
    return '<div class="gov-row">'
      + '<span class="gov-check">' + r.check + '</span>'
      + flagHTML(r)
      + '<span class="gov-detail">' + r.detail + '</span>'
      + '</div>';
  }).join('');
  host.innerHTML =
    '<div class="gov-panel">'
    + '<div class="gov-prose">'
    + '<span class="gov-label">' + s.label + '</span>'
    + '<h4 class="gov-heading">' + s.heading + '</h4>'
    + '<p class="gov-body">' + s.body + '</p>'
    + '</div>'
    + '<div class="gov-comment">'
    + '<div class="gov-header"><span class="gov-bot">CI Automation</span><span class="gov-stamp">governance comment · updated in-place</span></div>'
    + '<div class="gov-title">CI Governance Report</div>'
    + '<div class="gov-table">' + rows + '</div>'
    + '<div class="gov-footer gov-' + s.footerTone + '">' + s.footer + '</div>'
    + '</div>'
    + '</div>'
    + '<div class="gov-toggle">'
    + '<button class="gov-dot' + (i === 0 ? ' active' : '') + '" data-state="0">01</button>'
    + '<button class="gov-dot' + (i === 1 ? ' active' : '') + '" data-state="1">02</button>'
    + '</div>';
  host.querySelectorAll('.gov-dot').forEach(function(d) {
    d.addEventListener('click', function() { ciGovernGo(parseInt(this.dataset.state)); });
  });
}

function ciGovernGo(i) {
  renderGovComment(i);
}
