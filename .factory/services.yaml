commands:
  install: pnpm install
  build: pnpm build
  test: pnpm test:run --reporter=verbose
  typecheck: pnpm typecheck
  lint: pnpm lint
  test:integration: pnpm test:integration
  test:e2e: pnpm test:e2e

services:
  web:
    start: pnpm dev --port 3000
    stop: lsof -ti :3000 | xargs kill
    healthcheck: curl -sf http://localhost:3000
    port: 3000
    depends_on: []
