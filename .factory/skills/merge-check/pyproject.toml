[project]
name = "merge-check"
version = "0.1.0"
description = "The deterministic core of the /merge-check adversarial-review skill: roster discovery, incremental-review planning, the mutation/discrimination sensor, and the anti-forgery attestation writer."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "ruff>=0.6.0",
]
# Coverage-guided fuzzing harnesses (tests/fuzz/*_atheris.py). Optional and never
# part of the default suite: atheris needs a libFuzzer/clang toolchain that is not
# present everywhere. The same invariants are covered portably by the Hypothesis
# fuzz harnesses in tests/fuzz/test_*.py, which DO run in the default suite.
fuzz = [
    "atheris>=2.3; platform_system == 'Linux'",
]

[project.scripts]
merge-check-roster = "merge_check.cli.discover_roster:main"
merge-check-config = "merge_check.cli.merge_check_config:main"
merge-check-plan = "merge_check.cli.incremental_review:main"
merge-check-sensor = "merge_check.cli.mutation_sensor:main"
merge-check-iid = "merge_check.cli.resolve_mr_iid:main"
merge-check-attest = "merge_check.cli.write_attestation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merge_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
mypy_path = "src"
packages = ["merge_check"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "C90", "S", "PERF", "RUF"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests may use assert, subprocess, tmp paths, and hardcoded sample tokens freely.
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S311", "S314", "S603", "S607"]
