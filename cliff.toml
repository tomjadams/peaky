# git-cliff configuration — keep-a-changelog format
# https://git-cliff.org/docs/configuration
#
# Grouping strategy:
#   Commits are grouped by conventional-commit *type*, with the scope
#   rendered inline.  This reads naturally: "what bug fixes landed?
#   what features shipped?  what docs changed?"
#
#   Type → Section:  feat → Features,  fix → Bug Fixes,  docs → Documentation,
#                   refactor → Code Refactoring,  everything else → Maintenance

[changelog]
header = """# Developer Changelog

All development changes to Peaky are documented here: implementation detail, bug fixes, docs, etc. For customer-facing, see [Product Changes](../product_changelog.md).

<details>
<summary>How this changelog is generated</summary>

We follow [Conventional Commits](https://www.conventionalcommits.org/) and generate this file with [git-cliff](https://git-cliff.org/). Commits are grouped by type and sorted newest-first.

| Type prefix | Section | Description |
|-------------|---------|-------------|
| `feat` | **Features** | New functionality |
| `fix` | **Bug Fixes** | Corrections to existing behavior |
| `docs` | **Documentation** | Docs, explainer, or walkthrough changes |
| `refactor` | **Code Refactoring** | Structural changes without new features |
| `chore`, `ci`, `build`, `test`, `style`, `polish`, `perf`, `remove`, `enhance` | **Maintenance** | Tooling, dependencies, formatting, tests, polish |

Commits without a scope appear plain; commits with a scope show as `**scope:** message`.

Run `make changelog` locally to preview before pushing.

</details>

---

"""
body = """
{% if version -%}
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{# Breaking Changes — surfaced first so developers see them immediately #}
{%- set_global has_breaking = false -%}
{%- for commit in commits -%}
{%- if commit.breaking -%}
{%- set_global has_breaking = true -%}
{%- endif -%}
{%- endfor -%}
{%- if has_breaking %}

### Breaking Changes

{% for commit in commits -%}
{% if commit.breaking -%}
{% set_global bmsg = commit.message -%}
{% for link in commit.links -%}
{% set_global bmsg = bmsg | replace(from="(" ~ link.text ~ ")", to="([" ~ link.text ~ "](" ~ link.href ~ "))") -%}
{% set_global bmsg = bmsg | replace(from=" " ~ link.text ~ " ", to=" [" ~ link.text ~ "](" ~ link.href ~ ") ") -%}
{% set_global bmsg = bmsg | replace(from=" " ~ link.text, to=" [" ~ link.text ~ "](" ~ link.href ~ ")") -%}
{% endfor -%}
{% if commit.scope -%}
- **{{ commit.scope }}:** {{ bmsg }}
{% else -%}
- {{ bmsg }}
{% endif -%}
{% endif -%}
{% endfor %}
{%- endif -%}

{# Normal sections — all commits including breaking ones appear in context too #}
{% for group, group_commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in group_commits -%}
{% set_global cmsg = commit.message -%}
{% for link in commit.links -%}
{% set_global cmsg = cmsg | replace(from="(" ~ link.text ~ ")", to="([" ~ link.text ~ "](" ~ link.href ~ "))") -%}
{% set_global cmsg = cmsg | replace(from=" " ~ link.text ~ " ", to=" [" ~ link.text ~ "](" ~ link.href ~ ") ") -%}
{% set_global cmsg = cmsg | replace(from=" " ~ link.text, to=" [" ~ link.text ~ "](" ~ link.href ~ ")") -%}
{% endfor -%}
{% if commit.scope -%}
- **{{ commit.scope }}:** {{ cmsg }}
{% else -%}
- {{ cmsg }}
{% endif -%}
{% endfor %}
{% endfor %}"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Map conventional-commit types to changelog sections.
# Ordering here controls section order in the output (first → last).
commit_parsers = [
    # Skip the changelog job's own commits; otherwise each daily run would
    # include every previous "update changelog" commit and the changelog would
    # keep growing with noise.
    { message = "^chore\\(changelog\\): update changelog", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix",  group = "Bug Fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^refactor", group = "Code Refactoring" },
    { message = "^chore", group = "Maintenance" },
    { message = "^ci",  group = "Maintenance" },
    { message = "^build", group = "Maintenance" },
    { message = "^test", group = "Maintenance" },
    { message = "^style", group = "Maintenance" },
    { message = "^polish", group = "Maintenance" },
    { message = "^remove", group = "Maintenance" },
    { message = "^perf", group = "Maintenance" },
    { message = "^enhance", group = "Maintenance" },
    { message = "^revert", group = "Maintenance" },
]
# Extract GitLab issue (#N) and MR (!N) references from commit messages.
link_parsers = [
    { pattern = "#(\\d+)", text = "#$1", href = "https://gitlab.is.adyen.com/containers/rtf/peaky/-/issues/$1" },
    { pattern = "!(\\d+)", text = "!$1", href = "https://gitlab.is.adyen.com/containers/rtf/peaky/-/merge_requests/$1" },
]
filter_commits = true
tag_pattern = "v?[0-9].*"
sort_commits = "newest"
