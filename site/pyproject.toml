[project]
name = "site"
version = "0.1.0"
description = "Peaky Documentation Site"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "git-cliff>=2.6.1,<3.0.0",
    "zensical==0.0.36",
]

[tool.uv]
native-tls = true
